<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambiance Video Generator — chargement…</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Segoe UI","Helvetica Neue",sans-serif;
  background:radial-gradient(900px 420px at 0% 0%,#dbeafe 0%,transparent 55%),#f3f5f8;color:#15202b}
  .box{max-width:420px;padding:1.5rem;background:#fff;border:1px solid #e4e7ec;border-radius:14px;text-align:center}
  p{color:#667085;line-height:1.45}
  a{color:#2563eb}
  .err{color:#dc2626}
</style>
</head>
<body>
<div class="box" id="box">
  <h1 style="margin:0 0 .5rem;font-size:1.25rem">Ambiance Video Generator</h1>
  <p id="msg">Chargement de la dernière version (mémoire projet + surveillance hors pic)…</p>
</div>
<script>
(function () {
  var SRC = 'https://raw.githubusercontent.com/urdirditfurd/Agnes-video/cursor/ambiance-agnes-exclusive-b447/ambiance-video-generator/index.html?t=' + Date.now();
  var FALLBACK = 'https://raw.githubusercontent.com/urdirditfurd/Agnes-video/cursor/ambiance-agnes-exclusive-b447/ambiance-video-generator/index.html';
  function fail(e) {
    var box = document.getElementById('box');
    box.innerHTML = '<h1 style="margin:0 0 .5rem;font-size:1.25rem">Téléchargement manuel</h1>' +
      '<p class="err">Chargement auto bloqué (CORS / file://). Enregistre le fichier puis ouvre-le.</p>' +
      '<p><a download="index.html" href="' + FALLBACK + '">Télécharger index.html</a></p>' +
      '<p style="font-size:.85rem">Ou lance <code>demarrer.bat</code> / <code>demarrer.sh</code> depuis le dossier du projet.</p>' +
      '<pre style="text-align:left;font-size:.75rem;overflow:auto">' + (e && e.message ? e.message : String(e)) + '</pre>';
  }
  fetch(SRC, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (html) {
    document.open();
    document.write(html);
    document.close();
  }).catch(fail);
})();
</script>
</body>
</html>
